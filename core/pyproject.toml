[project]
name = "mnemo"
version = "0.1.0"
description = "MNEMO — reconocimiento facial consentido como apoyo a la memoria social (banco de pruebas)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "onnxruntime>=1.18", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "matplotlib"]

[project.scripts]
mnemo = "mnemo.cli:main"
mnemo-eval = "mnemo.eval.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mnemo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
